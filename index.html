  <script>
    (function() {
      try {
        var savedT = null;
        try { savedT = window.localStorage.getItem('theme') || window.localStorage.getItem('settat_personal_operations_system_v3'); } catch(err) {}
        if (savedT && savedT.indexOf('{') !== -1) {
          try {
            var parsed = JSON.parse(savedT);
            savedT = parsed.settings && parsed.settings.theme;
          } catch(e) {}
        }
        var t = savedT || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
          document.documentElement.classList.remove('light-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
          document.documentElement.classList.add('light-mode');
        }

        // Smart GitHub Pages auto-router:
        // When deploying raw root to GitHub Pages, redirect to compiled docs/
        var host = window.location.hostname || '';
        var path = window.location.pathname || '';
        if (host.indexOf('github.io') !== -1) {
          if (path.indexOf('/docs') === -1 && path.indexOf('/dist') === -1) {
            var target = path.replace(/\/+$/, '') + '/docs/';
            window.location.replace(target);
          }
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="bg-[#12131C] text-white min-h-screen">

    </div>

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
